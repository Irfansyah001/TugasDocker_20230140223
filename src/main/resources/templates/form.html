<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="id">
<head>
    <meta charset="UTF-8">
    <title>Form Input Mahasiswa Irfansyah 20230140223</title>
    <link rel="stylesheet" th:href="@{/style.css}">
</head>
<body>
<div class="container">
    <div class="card form-card">
        <h2>Form Input Mahasiswa</h2>

        <form action="/form" method="post" th:object="${user}">
            <div class="form-group">
                <label for="nama">Nama:</label>
                <input type="text" id="nama" th:field="*{nama}" placeholder="Masukkan nama lengkap" required>
            </div>
            <div class="form-group">
                <label for="nim">NIM:</label>
                <input type="text" id="nim" th:field="*{nim}" placeholder="Masukkan NIM" required>
            </div>
            <div class="form-group">
                <label>Jenis Kelamin:</label>
                <div class="radio-group">
                    <label class="radio-label">
                        <input type="radio" name="jenisKelamin" value="Laki-laki" required>
                        Laki-laki
                    </label>
                    <label class="radio-label">
                        <input type="radio" name="jenisKelamin" value="Perempuan">
                        Perempuan
                    </label>
                </div>
            </div>
            <button type="submit" class="btn btn-primary">Submit</button>
        </form>

        <a href="/home" class="link back-link">Kembali ke Home</a>
    </div>
</div>
</body>
</html>
